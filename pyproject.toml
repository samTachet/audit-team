[project]
name = "audit-team"
version = "2.0.0"
description = "Équipe d'audit contrainte (v2 ACSI) : agents CrewAI orchestrés par un graphe LangGraph, derrière la gateway ACSI (budget, approbation humaine, journal chaîné)"
readme = "README.md"
# CrewAI exige < 3.14 ; LangGraph >= 3.10. Python 3.13 épinglé (.python-version, CI, image).
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.157.0",
  "jsonschema>=4.21",
  "uvicorn>=0.54.0",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "crewai==1.15.39",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acsi_agent", "src/audit_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:crewai.*",
  "ignore::DeprecationWarning:pydantic.*",
]
